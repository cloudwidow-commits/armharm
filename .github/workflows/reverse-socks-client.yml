name: "Reverse SOCKS5 - Server/Client Test"

# Runs the reverse SOCKS5 client/server over a plain-TCP control link (no TLS
# termination, no Tailscale). The client auto-detects the transport, so no mode
# flag or coordination is needed. Two modes (workflow_dispatch):
#   * e2e   — short self-contained round-trip (server+client+origin on the
#             runner, runs on push/PR too). Code-correctness check.
#   * soak  — long-running stability run.
#             - server_address given: CI runs the CLIENT ONLY, dialing out to
#               your real plain-TCP server. Use this to keep a tunnel node up
#               against a deployment you control.
#             - server_address blank: falls back to self-contained (server +
#               client + origin on the runner), probing the SOCKS port locally.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/reverse_socks_client.py'
      - 'src/reverse_socks_server.py'
      - '.github/workflows/reverse-socks-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/reverse_socks_client.py'
      - 'src/reverse_socks_server.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode (e2e = quick round-trip, soak = long run)'
        required: false
        default: 'e2e'
        type: choice
        options: [ 'e2e', 'soak' ]
      soak_minutes:
        description: 'Soak duration in minutes (used when mode=soak)'
        required: false
        default: '30'
        type: string
      server_address:
        description: 'External plain-TCP server for soak (host:port). Leave blank = self-contained local soak. Ignored unless mode=soak.'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'
  CLIENT_PATH: 'src/reverse_socks_client.py'
  SERVER_PATH: 'src/reverse_socks_server.py'

jobs:
  end-to-end:
    name: "End-to-end SOCKS5 over plain TCP"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'soak'
    timeout-minutes: 5

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Validate script syntax"
        run: |
          python -m py_compile "$CLIENT_PATH" "$SERVER_PATH"
          echo "Script syntax valid"

      - name: "Run end-to-end plain-TCP SOCKS5 test"
        run: |
          set -u
          mkdir -p logs

          # --- local HTTP origin the SOCKS tunnel will reach ---
          python -m http.server 8080 --bind 127.0.0.1 > logs/origin.log 2>&1 &
          ORIGIN_PID=$!

          # --- reverse SOCKS5 server: control on 9000, SOCKS on 1080 ---
          python "$SERVER_PATH" -c 9000 -s 1080 -v > logs/server.log 2>&1 &
          SERVER_PID=$!

          # --- reverse client (auto-detects plain TCP) ---
          python "$CLIENT_PATH" localhost:9000 -v > logs/client.log 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            kill $CLIENT_PID $SERVER_PID $ORIGIN_PID 2>/dev/null || true
            wait $CLIENT_PID $SERVER_PID $ORIGIN_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for client to register with server..."
          REGISTERED=0
          for i in $(seq 1 30); do
            if grep -q "registered" logs/server.log 2>/dev/null; then
              REGISTERED=1
              break
            fi
            sleep 1
          done

          if [ "$REGISTERED" -ne 1 ]; then
            echo "::error::Client failed to register with server within 30s"
            echo "----- server.log -----"; cat logs/server.log || true
            echo "----- client.log -----"; cat logs/client.log || true
            exit 1
          fi
          echo "Client registered. Probing SOCKS5 round-trip..."

          # --- actual SOCKS5 round-trip through the tunnel ---
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 -x socks5h://127.0.0.1:1080 \
                   http://127.0.0.1:8080/ -o /dev/null; then
              OK=1
              break
            fi
            sleep 1
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::SOCKS5 round-trip through the tunnel failed"
            echo "----- server.log -----"; cat logs/server.log || true
            echo "----- client.log -----"; cat logs/client.log || true
            exit 1
          fi

          echo "::notice::SOCKS5 round-trip OK (curl over socks5h://127.0.0.1:1080)"

          echo "roundtrip=ok" >> "$GITHUB_OUTPUT"
          {
            echo "## End-to-end Result"
            echo "- **Control link**: plain TCP (auto-detected by client)"
            echo "- **Registration**: ok"
            echo "- **SOCKS5 round-trip**: ok"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload logs as artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "reverse-socks-e2e-logs-${{ github.run_id }}"
          path: logs/
          retention-days: 7
          if-no-files-found: warn

  soak:
    name: "Long-running soak (plain TCP)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'soak'
    # GitHub Actions expressions don't support arithmetic, so use a generous flat
    # ceiling. The soak loop itself ends on time (it watches the wall clock); this
    # is just a safety net. Raise it if you run very long soaks.
    timeout-minutes: 360

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Validate script syntax"
        run: |
          python -m py_compile "$CLIENT_PATH" "$SERVER_PATH"
          echo "Script syntax valid"

      - name: "Run long-running soak"
        run: |
          set -u
          mkdir -p logs

          SERVER_ADDR="${SERVER_ADDR:-}"
          SOAK_MINS="${SOAK_MINS:-30}"
          CLIENT_PID=""
          SERVER_PID=""
          ORIGIN_PID=""

          cleanup() {
            [ -n "$CLIENT_PID" ] && kill "$CLIENT_PID" 2>/dev/null || true
            [ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null || true
            [ -n "$ORIGIN_PID" ] && kill "$ORIGIN_PID" 2>/dev/null || true
            wait 2>/dev/null || true
          }
          trap cleanup EXIT

          END=$(( $(date +%s) + SOAK_MINS * 60 ))

          if [ -n "$SERVER_ADDR" ]; then
            # ---- External soak: client dials out to YOUR server (client-only) ----
            echo "Soak target: external server $SERVER_ADDR (client-only)"
            echo "Running client for ${SOAK_MINS} minutes; monitoring control-link health..."
            python "$CLIENT_PATH" "$SERVER_ADDR" -v > logs/client.log 2>&1 &
            CLIENT_PID=$!

            # Must reach "registered" at least once, or the endpoint is unreachable.
            REGISTERED=0
            for i in $(seq 1 30); do
              if grep -q "Connected and registered" logs/client.log 2>/dev/null; then
                REGISTERED=1; break
              fi
              sleep 1
            done
            if [ "$REGISTERED" -ne 1 ]; then
              echo "::error::Client never registered with $SERVER_ADDR within 30s"
              cat logs/client.log 2>/dev/null || true
              exit 1
            fi
            echo "Client registered with $SERVER_ADDR"

            # Monitor: stay alive SOAK_MINS, flag if the link drops and never recovers.
            OK=0; RECONNECTS=0; LAST_OK=$(date +%s)
            while [ "$(date +%s)" -lt "$END" ]; do
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
                echo "::error::Client process exited unexpectedly"
                tail -n 30 logs/client.log 2>/dev/null || true
                exit 1
              fi
              if grep -q "Connected and registered" logs/client.log 2>/dev/null \
                 && tail -n 5 logs/client.log 2>/dev/null | grep -qiE "Reconnecting|connection closed|error"; then
                RECONNECTS=$((RECONNECTS + 1))
                echo "[watch] reconnect event #$RECONNECTS detected"
              fi
              sleep 60
              if kill -0 "$CLIENT_PID" 2>/dev/null; then
                OK=$((OK + 1)); LAST_OK=$(date +%s)
                echo "[watch $(date +%H:%M)] alive (uptime ${OK}m)"
              fi
            done

            {
              echo "## Soak Result (external: $SERVER_ADDR)"
              echo "- **Duration**: ${SOAK_MINS} minutes"
              echo "- **Alive checks**: $OK"
              echo "- **Reconnect events**: $RECONNECTS"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- Self-contained local soak (server + client + origin) ----
          echo "Soak target: self-contained (no server_address given)"
          python -m http.server 8080 --bind 127.0.0.1 > logs/origin.log 2>&1 &
          ORIGIN_PID=$!
          python "$SERVER_PATH" -c 9000 -s 1080 -v > logs/server.log 2>&1 &
          SERVER_PID=$!
          python "$CLIENT_PATH" localhost:9000 -v > logs/client.log 2>&1 &
          CLIENT_PID=$!

          echo "Waiting for client to register..."
          REGISTERED=0
          for i in $(seq 1 30); do
            if grep -q "registered" logs/server.log 2>/dev/null; then
              REGISTERED=1; break
            fi
            sleep 1
          done
          if [ "$REGISTERED" -ne 1 ]; then
            echo "::error::Client failed to register"
            cat logs/server.log logs/client.log 2>/dev/null || true
            exit 1
          fi
          curl -fsS --max-time 5 -x socks5h://127.0.0.1:1080 http://127.0.0.1:8080/ -o /dev/null \
            || { echo "::error::Initial SOCKS round-trip failed"; exit 1; }

          echo "Tunnel up. Soaking for ${SOAK_MINS} minutes, probing every 60s..."
          FAILS=0; PROBES=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60
            PROBES=$((PROBES + 1))
            if curl -fsS --max-time 5 -x socks5h://127.0.0.1:1080 http://127.0.0.1:8080/ -o /dev/null; then
              echo "[probe $PROBES] ok"
            else
              FAILS=$((FAILS + 1))
              echo "[probe $PROBES] FAILED"
            fi
          done

          echo "Soak complete: $PROBES probes, $FAILS failures"
          {
            echo "## Soak Result (self-contained)"
            echo "- **Duration**: ${SOAK_MINS} minutes"
            echo "- **Probes**: $PROBES"
            echo "- **Failures**: $FAILS"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILS" -gt 0 ]; then
            echo "::error::$FAILS probe(s) failed during soak"
            exit 1
          fi
        env:
          SOAK_MINS: ${{ github.event.inputs.soak_minutes }}
          SERVER_ADDR: ${{ github.event.inputs.server_address }}

      - name: "Upload logs as artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "reverse-socks-soak-logs-${{ github.run_id }}"
          path: logs/
          retention-days: 7
          if-no-files-found: warn
